<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1222">
<title>Track a delivery · ReliefGrid</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/phone.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="10" fill="#0E7C6B"/><g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6V28M7.5 11.5L26.5 22.5M26.5 11.5L7.5 22.5"/><path d="M17 10.5L22.6 13.75V20.25L17 23.5L11.4 20.25V13.75Z"/></g><circle cx="17" cy="17" r="2.8" fill="#FF4D94"/></svg>ReliefGrid</div>
  </div>
  <h1>Track a delivery</h1>
  <form class="track-form" id="tf" role="search">
    <label for="code" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Waybill or request number</label>
    <input id="code" name="code" placeholder="WB-1031-007 or REQ-012" autocomplete="off" spellcheck="false" autocapitalize="characters" enterkeyhint="search">
    <button type="submit">Track</button>
  </form>
</header>
<main id="main" aria-live="polite">
  <section class="card"><p class="hint" style="margin:0">Enter the waybill number from the delivery slip, or the request number the hub gave you. No login needed.</p></section>
</main>
<footer>ReliefGrid · Team FEAST</footer>
<script type="module" src="js/track.js"></script>
</body>
</html>
